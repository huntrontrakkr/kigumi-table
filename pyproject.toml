[project]
name = "kigumi-table"
version = "0.1.0"
description = "Generative nail-free (kigumi) coffee tables: mushroom-stem legs, tiered interlocking lattice, glass top clamped by threaded caps"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Wade Hunter" }]
requires-python = ">=3.12"
dependencies = [
    "build123d>=0.13.0",
    "contourpy>=1.3.3",
    "ezdxf>=1.4.5",
    "manifold3d>=3.5.4",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pillow>=12.3.0",
    "rhino3dm>=8.35.0",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
]

[project.urls]
Homepage = "https://huntrontrakkr.github.io/kigumi-table/"
Source = "https://github.com/huntrontrakkr/kigumi-table"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "kigumi"
module-root = ""
